{% extends "base.html" %}

{% block title %}الشركات والمنتجات - الراعي الصالح{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container">
        <h1>اختر الشركة</h1>
        <p class="section-subtitle">اختر الشركة لعرض المنتجات وتفاصيلها.</p>
        
        <div class="brands-grid">
            {% for slug, catalog in brands.items() %}
            <a href="{{ url_for('brand_detail', brand=slug) }}" class="brand-card-link">
                <div class="brand-card product-clickable">
                    <span class="brand-wordmark">{{ catalog.name }}</span>
                    <h3>{{ catalog.name }}</h3>
                    <p>عرض الأقسام والمنتجات</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
